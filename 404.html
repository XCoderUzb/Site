<!doctype html>
<html><head><meta charset="utf-8"><title>AniManxwa</title>
<script>/* GitHub Pages: noma'lum yo'lni index.html ga yo'naltiradi (havola o'zgarmaydi) */
var l=location,seg=/github\.io$/.test(l.hostname)?1:0;
l.replace(l.protocol+'//'+l.hostname+(l.port?':'+l.port:'')+l.pathname.split('/').slice(0,1+seg).join('/')+'/?/'+l.pathname.slice(1).split('/').slice(seg).join('/').replace(/&/g,'~and~')+(l.search?'&'+l.search.slice(1).replace(/&/g,'~and~'):'')+l.hash);
</script></head><body></body></html>
